            - generic [ref=e29]:
              - article [ref=e30]:
                - img "李凤" [ref=e31]
                - generic [ref=e32]:
                  - heading "李凤" [level=3] [ref=e33]
                  - paragraph [ref=e34]: 教授
                  - paragraph [ref=e35]: 李凤，北京化工大学教授、博士生导师，国家优秀青年科学基金获得者。本科毕业于兰州大学化学化工学院，博士毕业于中国科学院国家纳米科学中心，之后在清华大学化学系从事博士后阶段的研究。2018年入职天津大学化工学院，2022年调入北京化工大学化学学院担任化学+生物工程双学位专业负责人。研究成果在Chem. Soc. Rev.、Nature Commun.、J. Am. Chem. Soc.、Angew. Chem.、Adv. Mater.、Nano Lett.、Nano Today、Acc. Mater. Res.等杂志发表论文70余篇。申请专利13项，主持国家自然科学基金等基金项目7项。担任北京市药学会生物与基因药学专委会和核酸药物专委会委员、Chinese Chemical Letters编委、Advanced Clinical Engineering青年编委等。
              - article [ref=e36]:
                - img "董宇航" [ref=e37]
                - generic [ref=e38]:
                  - heading "董宇航" [level=3] [ref=e39]
                  - paragraph [ref=e40]: 讲师
                  - paragraph [ref=e41]: 董宇航，博士，北京化工大学化学学院讲师。分别于2017年和2022年在天津大学获学士学位和博士学位，2022年以博士后进入北京化工大学化学学院工作。研究方向为核酸化学、核酸纳米药物创制，以及新型药物递送系统的构建和生物医学研究。近年来，以通讯/第一作者在J. Am. Chem. Soc.、Angew. Chem. Int. Ed.、Chem. Rev.、Chem. Soc. Rev.、Nano Today、Adv. Funct. Mater.等期刊发表论文20余篇，申请发明专利11项，主持国家级、省部级等基金项目5项。现任Advanced Clinical Engineering、Chinese Chemical Letters期刊的青年编委。主讲《分析化学》、《核酸化学与材料》等课程。
